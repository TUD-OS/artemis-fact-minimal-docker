name: Build and Push

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
    tags: '*'
  release:
    types:
      - created

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tud-os/artemis-fact-minimal-docker

jobs:
  buildx:
    name: Build and Push the Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Compute Tag
        uses: actions/github-script@v7
        id: compute-tag
        with:
          result-encoding: string
          script: |
            if (context.eventName === "pull_request") {
              return "pr-" + context.issue.number;
            }
            if (context.eventName === "push") {
              if (context.ref.startsWith("refs/tags/")) {
                return context.ref.slice(10);
              }
              if (context.ref === "refs/heads/main") {
                return "latest";
              }
            }
            return "FALSE";

      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ steps.compute-tag.outputs.result }}
          labels: org.opencontainers.image.source=https://github.com/TUD-OS/artemis-fact-minimal-docker
          push: true
